<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>META ENGLISH</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0D132B;--indigo:#6776D3;
  --bg:#0D132B;--surface:#F2F4F7;--card:#FFFFFF;--border:#DDE2EC;
  --accent:#6776D3;--text:#191F28;--muted:#5A6474;--radius:8px;
}
body{word-break:keep-all;letter-spacing:-0.02em;-webkit-font-smoothing:antialiased;
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 0;
  overflow:auto;position:relative;
}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.orb1{width:520px;height:520px;background:radial-gradient(circle,rgba(103,118,211,.14) 0%,transparent 70%);top:-120px;left:-120px}
.orb2{width:420px;height:420px;background:radial-gradient(circle,rgba(103,118,211,.10) 0%,transparent 70%);bottom:-60px;right:-60px}
.container{position:relative;z-index:1;width:100%;max-width:420px;padding:20px;
  animation:rise .7s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.container{animation:none}}
.logo{text-align:center;margin-bottom:40px}
.logo-title{font-size:42px;font-weight:800;letter-spacing:-0.03em;line-height:1.1;color:#fff}
.logo-title .hl{color:var(--indigo)}
.logo-sub{font-size:12px;color:rgba(168,177,201,.9);letter-spacing:3px;text-transform:uppercase;margin-top:10px;font-weight:600}
.card{background:var(--card);border-radius:12px;padding:36px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.card-title{font-size:19px;font-weight:800;margin-bottom:6px;letter-spacing:-0.02em}
.card-sub{font-size:13.5px;color:var(--muted);margin-bottom:28px;line-height:1.6}
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:8px}
label{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0}
input{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;color:var(--text);font-family:inherit;letter-spacing:-0.02em;
  font-size:15px;outline:none;transition:border-color .2s,background .2s;
}
input:focus{border-color:var(--accent);background:#fff}
input::placeholder{color:#9AA1B0}
.btn{
  padding:15px;border:none;border-radius:var(--radius);
  background:var(--navy);
  color:#fff;font-family:inherit;letter-spacing:-0.01em;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;
  transition:background .18s ease,transform .06s ease;
}
.btn:hover{background:#1B2340}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{text-align:center;font-size:13px;padding:10px;border-radius:var(--radius);display:none}
.msg.error{background:rgba(229,72,77,.08);color:#D13438;display:block}
.hint{text-align:center;font-size:12.5px;color:rgba(168,177,201,.65);margin-top:20px;line-height:1.6}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="container">
  <div class="logo">
    <div class="logo-title">META ENGLISH<span class="hl">.</span></div>
    <div class="logo-sub">Members Only</div>
  </div>
  <div class="card">
    <div class="card-title">로그인</div>
    <div class="card-sub">등록된 이름과 비밀번호를 입력해주세요.<br>미등록 시 선생님께 문의하세요.</div>
    <div class="form">
      <div class="field">
        <label>이름</label>
        <input type="text" id="name" placeholder="홍길동" autocomplete="off">
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="phone" placeholder="핸드폰 번호 또는 비밀번호"
               onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="msg" id="msg"></div>
      <button class="btn" id="login-btn" onclick="doLogin()">입장하기</button>
    </div>
  </div>
  <div class="hint">문제가 있으면 관리자에게 문의해주세요</div>
</div>

<script>
const SUPA_URL = 'https://cheuclwcrxuofiomhtuz.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoZXVjbHdjcnh1b2Zpb21odHV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMzM1NzEsImV4cCI6MjA5MDkwOTU3MX0.Pnmf1_DYGVXpDvEf-nWXG4WTAu-pNlu4xJyEzdHeUMw';

const me = JSON.parse(sessionStorage.getItem('qhub_user')||'null');
if(me) location.href = me.role==='admin' ? 'admin.html' : 'dashboard.html';

function showMsg(text){ const el=document.getElementById('msg'); el.textContent=text; el.className='msg error' }

async function doLogin(){
  const name  = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim().replace(/-/g,'');
  if(!name||!phone){ showMsg('이름과 비밀번호를 모두 입력해주세요.'); return }
  const btn = document.getElementById('login-btn');
  btn.disabled=true; btn.textContent='확인 중...';
  try {
    // Edge Function으로 로그인 → JWT 발급 (RLS와 호환)
    const res = await fetch(`${SUPA_URL}/functions/v1/auth_login`, {
      method:'POST',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({name, phone})
    });
    if(res.status === 401){
      showMsg('등록된 정보와 일치하지 않아요. 선생님께 문의해주세요.');
      btn.disabled=false; btn.textContent='입장하기'; return;
    }
    if(!res.ok){
      showMsg('서버 오류가 발생했어요. 잠시 후 다시 시도해주세요.');
      btn.disabled=false; btn.textContent='입장하기'; return;
    }
    const {token, user} = await res.json();
    sessionStorage.setItem('qhub_token', token);
    sessionStorage.setItem('qhub_user', JSON.stringify(user));
    location.href = user.role==='admin' ? 'admin.html' : 'dashboard.html';
  } catch(e){ showMsg('서버 연결 오류가 발생했어요. 잠시 후 다시 시도해주세요.'); btn.disabled=false; btn.textContent='입장하기' }
}
</script>
</body>
</html>
