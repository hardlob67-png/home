<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>듣기 받아쓰기 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea;
    --paper: #fefcf7;
    --ink: #1f1d1a;
    --muted: #7d756a;
    --rule: #e2dccf;
    --accent: #1a4d3a;
    --accent-soft: #e7eee9;
    --correct: #1a7a4c;
    --correct-bg: #e3f2e9;
    --wrong: #b53b2e;
    --wrong-bg: #fae5e2;
    --num: #b8a572;
    --shadow: 0 1px 0 rgba(31,29,26,0.04), 0 8px 24px -12px rgba(31,29,26,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
    font-size: 16px;
    line-height: 1.7;
    letter-spacing: -0.005em;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(184,165,114,0.06) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(26,77,58,0.04) 0%, transparent 50%);
  }

  .wrap { max-width: 820px; margin: 0 auto; padding: 56px 24px 120px; }

  /* ---------- header ---------- */
  .site-head { text-align: center; margin-bottom: 56px; padding-bottom: 36px; border-bottom: 1px solid var(--rule); position: relative; }
  .site-head::after { content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 60px; height: 3px; background: var(--accent); }
  .eyebrow { font-family: 'Fraunces', serif; font-style: italic; font-size: 14px; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  h1 { font-size: clamp(28px, 5vw, 42px); font-weight: 700; margin: 0 0 12px; letter-spacing: -0.02em; }
  .lede { color: var(--muted); font-size: 15px; max-width: 520px; margin: 0 auto; }

  /* ---------- score bar ---------- */
  .scorebar {
    position: sticky; top: 0; z-index: 50;
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: 12px; padding: 12px 16px 12px 20px;
    margin-bottom: 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    box-shadow: var(--shadow);
    flex-wrap: wrap;
  }
  .scorebar-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
  .scorebar-label { font-size: 13px; color: var(--muted); letter-spacing: 0.04em; white-space: nowrap; }
  .scorebar-num {
    font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; color: var(--accent);
    font-feature-settings: 'tnum'; white-space: nowrap;
  }
  .scorebar-num .of { color: var(--muted); font-size: 18px; font-weight: 400; }
  .progress { flex: 1; height: 6px; background: var(--rule); border-radius: 999px; overflow: hidden; max-width: 200px; min-width: 60px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #2d6e54); width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
  .btn-shuffle-all {
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 14px; border-radius: 8px;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    cursor: pointer; transition: all 0.15s; font-family: 'Pretendard', sans-serif;
    white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-shuffle-all:hover { background: #143b2c; border-color: #143b2c; }
  .btn-shuffle-all .ico { display: inline-block; transition: transform 0.4s; }
  .btn-shuffle-all:active .ico { transform: rotate(180deg); }

  /* ---------- passage card ---------- */
  .passage { background: var(--paper); border: 1px solid var(--rule); border-radius: 16px; padding: 32px; margin-bottom: 24px; box-shadow: var(--shadow); transition: border-color 0.2s; }
  .passage:focus-within { border-color: #c9c0ad; }
  .p-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px dashed var(--rule); }
  .p-num { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; color: var(--accent); letter-spacing: -0.01em; }
  .p-meta { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--muted); display: inline-flex; align-items: baseline; gap: 2px; }
  .p-meta .filled { color: var(--ink); font-weight: 500; min-width: 1ch; text-align: right; }
  .p-meta .lbl { margin-left: 6px; font-family: 'Pretendard', sans-serif; font-size: 12px; }

  /* ---------- audio player ---------- */
  .player { background: var(--accent-soft); border-radius: 10px; padding: 14px 16px; margin-bottom: 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .player audio { flex: 1; min-width: 240px; height: 38px; }
  .speeds { display: flex; gap: 4px; background: var(--paper); border-radius: 8px; padding: 3px; }
  .speed { background: transparent; border: 0; padding: 5px 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); cursor: pointer; border-radius: 6px; transition: all 0.15s; }
  .speed:hover { color: var(--ink); }
  .speed.is-active { background: var(--accent); color: #fff; }

  /* ---------- script body ---------- */
  .script { font-family: 'Pretendard', sans-serif; font-size: 16.5px; line-height: 2.0; color: var(--ink); word-spacing: 0.02em; }

  /* ---------- blank input ---------- */
  .blank-wrap { display: inline-block; vertical-align: baseline; white-space: nowrap; margin: 0 2px; }
  .blank-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--num);
    font-weight: 600;
    margin-right: 3px;
    user-select: none;
  }
  .blank {
    font: inherit; font-size: 16.5px; color: var(--ink); background: transparent;
    border: 0; border-bottom: 2px solid var(--num);
    padding: 1px 4px 2px; text-align: center; outline: none;
    transition: all 0.15s; font-family: 'Pretendard', sans-serif; min-width: 50px;
  }
  .blank:focus { background: #fffce8; border-bottom-color: var(--accent); }
  .blank.is-correct { background: var(--correct-bg); border-bottom-color: var(--correct); color: var(--correct); font-weight: 600; }
  .blank.is-wrong { background: var(--wrong-bg); border-bottom-color: var(--wrong); color: var(--wrong); text-decoration: line-through; text-decoration-color: var(--wrong); }
  .blank.is-revealed { background: #f5efe1; border-bottom-color: var(--num); color: var(--accent); font-weight: 600; font-style: italic; }

  /* ---------- actions ---------- */
  .actions { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--rule); display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 14px; font-weight: 500; padding: 10px 20px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer; transition: all 0.15s; font-family: 'Pretendard', sans-serif; }
  .btn:hover { border-color: var(--ink); }
  .btn-check { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-check:hover { background: #143b2c; border-color: #143b2c; }
  .btn-reveal { color: var(--muted); }
  .btn-reset { color: var(--muted); }
  .btn-shuffle { color: var(--muted); margin-left: auto; }

  /* ---------- footer ---------- */
  .site-foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--rule); }
  .site-foot .brand { font-family: 'Fraunces', serif; font-style: italic; color: var(--accent); }

  /* ---------- mobile ---------- */
  @media (max-width: 600px) {
    .wrap { padding: 32px 16px 80px; }
    .passage { padding: 20px; border-radius: 12px; }
    .script { font-size: 15.5px; line-height: 1.9; }
    .p-num { font-size: 22px; }
    .player { padding: 10px 12px; gap: 10px; }
    .player audio { min-width: 100%; }
    .scorebar { padding: 10px 12px; }
    .scorebar-num { font-size: 22px; }
    .progress { display: none; }
    .btn-shuffle { margin-left: 0; }
  }
</style>
</head>

<script>
(function() {
  const BLANKS_PER_PASSAGE = 10;
  const TOTAL_BLANKS = 100;
  const QUIZ_DATA = JSON.parse(document.getElementById('quiz-data').textContent);
  const dataById = Object.fromEntries(QUIZ_DATA.map(p => [p.id, p]));

  const norm = (s) => (s || '')
    .toLowerCase()
    .replace(/[\u2019\u2018\u201C\u201D]/g, "'")
    .replace(/[^a-z0-9'\-]/g, '')
    .trim();

  const escapeHtml = (s) => s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');

  const escapeAttr = (s) => escapeHtml(s);

  const passageScores = new Map();

  function updateGlobalScore() {
    let total = 0;
    passageScores.forEach(v => total += v);
    document.getElementById('totalCorrect').textContent = total;
    document.getElementById('progressFill').style.width = (total / TOTAL_BLANKS * 100) + '%';
  }

  // Pick n random blank positions from candidates, preferring unique lowercase forms
  function pickBlanks(candidates, n) {
    const byForm = {};
    candidates.forEach(c => {
      const k = c.word.toLowerCase();
      if (!byForm[k]) byForm[k] = [];
      byForm[k].push(c);
    });

    const forms = Object.keys(byForm);
    // Fisher-Yates shuffle
    for (let i = forms.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [forms[i], forms[j]] = [forms[j], forms[i]];
    }

    const picks = [];
    const usedSet = new Set();
    for (const form of forms) {
      const occs = byForm[form];
      const choice = occs[Math.floor(Math.random() * occs.length)];
      picks.push(choice);
      usedSet.add(choice);
      if (picks.length >= n) break;
    }

    // If not enough unique forms, top up with duplicates
    if (picks.length < n) {
      const remaining = candidates.filter(c => !usedSet.has(c));
      for (let i = remaining.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
      }
      picks.push(...remaining.slice(0, n - picks.length));
    }

    picks.sort((a, b) => a.start - b.start);
    return picks;
  }

  // Render the script HTML for a passage given chosen blank picks
  function renderScript(text, picks) {
    const parts = [];
    let cursor = 0;
    picks.forEach((p, idx) => {
      if (p.start > cursor) {
        parts.push(escapeHtml(text.substring(cursor, p.start)).replace(/\n/g, '<br>'));
      }
      const size = Math.max(p.word.length, 4);
      parts.push(
        '<span class="blank-wrap">' +
        '<span class="blank-num">' + (idx + 1) + ')</span>' +
        '<input class="blank" type="text"' +
        ' data-answer="' + escapeAttr(p.word) + '"' +
        ' data-idx="' + idx + '"' +
        ' size="' + size + '"' +
        ' maxlength="' + (size + 4) + '"' +
        ' autocomplete="off" autocapitalize="off" spellcheck="false"' +
        ' aria-label="빈칸 ' + (idx + 1) + '">' +
        '</span>'
      );
      cursor = p.end;
    });
    if (cursor < text.length) {
      parts.push(escapeHtml(text.substring(cursor)).replace(/\n/g, '<br>'));
    }
    return parts.join('');
  }

  function buildPassage(passageEl) {
    const id = passageEl.dataset.id;
    const data = dataById[id];
    const picks = pickBlanks(data.candidates, BLANKS_PER_PASSAGE);
    const scriptEl = passageEl.querySelector('.script');
    scriptEl.innerHTML = renderScript(data.text, picks);

    const filled = passageEl.querySelector('.filled');
    filled.textContent = '0';
    passageScores.set(id, 0);
    passageEl.querySelector('.btn-reveal').hidden = true;
    bindInputHandlers(passageEl);
  }

  function bindInputHandlers(passageEl) {
    const inputs = passageEl.querySelectorAll('.blank');
    inputs.forEach((inp, i) => {
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (i < inputs.length - 1) inputs[i + 1].focus();
          else passageEl.querySelector('.btn-check').click();
        }
      });
    });
  }

  function checkPassage(passageEl) {
    const id = passageEl.dataset.id;
    const inputs = passageEl.querySelectorAll('.blank');
    let correct = 0;
    inputs.forEach(inp => {
      inp.classList.remove('is-correct', 'is-wrong', 'is-revealed');
      const ans = inp.dataset.answer;
      if (norm(inp.value) === norm(ans)) {
        inp.classList.add('is-correct');
        correct++;
      } else if (inp.value.trim() !== '') {
        inp.classList.add('is-wrong');
      }
    });
    passageEl.querySelector('.filled').textContent = correct;
    passageScores.set(id, correct);
    updateGlobalScore();
    passageEl.querySelector('.btn-reveal').hidden = false;
  }

  function revealPassage(passageEl) {
    passageEl.querySelectorAll('.blank').forEach(inp => {
      if (!inp.classList.contains('is-correct')) {
        inp.value = inp.dataset.answer;
        inp.classList.remove('is-wrong');
        inp.classList.add('is-revealed');
      }
    });
  }

  function resetPassage(passageEl) {
    const id = passageEl.dataset.id;
    passageEl.querySelectorAll('.blank').forEach(inp => {
      inp.value = '';
      inp.classList.remove('is-correct', 'is-wrong', 'is-revealed');
    });
    passageEl.querySelector('.filled').textContent = '0';
    passageScores.set(id, 0);
    updateGlobalScore();
    passageEl.querySelector('.btn-reveal').hidden = true;
    const first = passageEl.querySelector('.blank');
    if (first) first.focus();
  }

  function shufflePassage(passageEl) {
    buildPassage(passageEl);
    updateGlobalScore();
  }

  // Init each passage
  document.querySelectorAll('.passage').forEach(passageEl => {
    buildPassage(passageEl);

    passageEl.querySelector('.btn-check').addEventListener('click', () => checkPassage(passageEl));
    passageEl.querySelector('.btn-reveal').addEventListener('click', () => revealPassage(passageEl));
    passageEl.querySelector('.btn-reset').addEventListener('click', () => resetPassage(passageEl));
    passageEl.querySelector('.btn-shuffle').addEventListener('click', () => shufflePassage(passageEl));

    // Speed buttons
    const audio = passageEl.querySelector('audio');
    passageEl.querySelectorAll('.speed').forEach(btn => {
      btn.addEventListener('click', () => {
        const sp = parseFloat(btn.dataset.speed);
        audio.playbackRate = sp;
        passageEl.querySelectorAll('.speed').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
      });
    });
  });

  // Global shuffle
  document.getElementById('shuffleAll').addEventListener('click', () => {
    document.querySelectorAll('.passage').forEach(buildPassage);
    updateGlobalScore();
    // tiny visual confirmation
    const sb = document.querySelector('.scorebar');
    sb.style.transition = 'background 0.3s';
    sb.style.background = '#fff8e1';
    setTimeout(() => { sb.style.background = ''; }, 300);
  });

  updateGlobalScore();
})();
</script>
</body>
</html>
