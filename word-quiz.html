<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단어 학습</title>
<style>
:root{
  --bg:#f7f8fb; --card:#ffffff; --border:#e5e8ef; --border-strong:#d0d5e0;
  --text:#1a1d27; --muted:#6b7280; --accent:#4f46e5; --accent-soft:#eef2ff;
  --success:#10b981; --success-soft:#ecfdf5; --error:#ef4444; --error-soft:#fef2f2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px;line-height:1.5}
.app{max-width:680px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.back{background:none;border:1px solid var(--border-strong);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--text)}
.back:hover{background:var(--card)}
.title{font-size:22px;font-weight:700}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:16px}
.section-title{font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.unit-btn{padding:14px 8px;border:1px solid var(--border-strong);border-radius:10px;background:var(--card);cursor:pointer;font-size:15px;font-weight:600;color:var(--text);transition:all .15s}
.unit-btn:hover{border-color:var(--accent)}
.unit-btn.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt-row{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:10px 18px;border:1px solid var(--border-strong);border-radius:10px;background:var(--card);cursor:pointer;font-size:14px;font-weight:500;color:var(--text)}
.opt.selected{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn-primary{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-primary:hover{filter:brightness(1.05)}
.btn-primary:disabled{background:var(--border-strong);cursor:not-allowed}
.btn-ghost{padding:10px 18px;background:none;border:1px solid var(--border-strong);border-radius:10px;cursor:pointer;font-size:14px;color:var(--text)}

/* Quiz screen */
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:var(--accent);transition:width .3s}
.progress-info{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:24px}
.score-chip{padding:2px 10px;border-radius:12px;font-weight:600;font-size:12px}
.score-chip.ok{background:var(--success-soft);color:var(--success)}
.score-chip.ng{background:var(--error-soft);color:var(--error)}

.question-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:48px 24px;text-align:center;margin-bottom:20px}
.q-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.q-text{font-size:36px;font-weight:700;word-break:break-word}
.q-text.ko{font-size:28px}

.choices{display:flex;flex-direction:column;gap:10px}
.choice{padding:16px 20px;background:var(--card);border:1px solid var(--border-strong);border-radius:12px;cursor:pointer;font-size:16px;text-align:left;transition:all .15s;display:flex;align-items:center;gap:12px;font-family:inherit;color:var(--text);width:100%}
.choice:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.choice:disabled{cursor:default}
.choice.correct{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.choice.wrong{background:var(--error-soft);border-color:var(--error);color:var(--error)}
.choice .num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--bg);font-weight:600;font-size:14px;flex-shrink:0}

.feedback{margin-top:16px;text-align:center;min-height:24px;font-size:14px;font-weight:500}
.feedback.ok{color:var(--success)}
.feedback.ng{color:var(--error)}

/* Result screen */
.result-hero{text-align:center;padding:36px 20px}
.result-emoji{font-size:64px;margin-bottom:8px}
.result-title{font-size:28px;font-weight:700;margin-bottom:8px}
.result-score{font-size:48px;font-weight:800;color:var(--accent);margin:16px 0}
.wrong-list{margin-top:16px}
.wrong-row{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border);font-size:14px}
.wrong-row:last-child{border:none}
.wrong-en{font-weight:600}
.wrong-ko{color:var(--muted)}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.spinner{text-align:center;padding:40px;color:var(--muted)}

@media(max-width:520px){
  .q-text{font-size:28px}
  .q-text.ko{font-size:22px}
  body{padding:16px}
}
</style>
</head>
<body>

<div class="app">

<!-- Header (전 단계 공통) -->
<div class="header">
  <button class="back" onclick="goBack()">← 돌아가기</button>
  <div style="flex:1;text-align:right">
    <div class="title" id="wordlist-title">단어장</div>
    <div class="sub" id="wordlist-sub"></div>
  </div>
</div>

<!-- Setup screen -->
<div id="screen-setup" style="display:none">
  <div class="card">
    <div class="section-title">단원 선택 (여러 개 선택 가능)</div>
    <div class="unit-grid" id="unit-grid"></div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="btn-ghost" onclick="selectAllUnits()">전체 선택</button>
      <button class="btn-ghost" onclick="clearUnits()">선택 해제</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">출제 방식</div>
    <div class="opt-row" id="mode-row">
      <button class="opt selected" data-mode="en2ko">영어 → 한글</button>
      <button class="opt" data-mode="ko2en">한글 → 영어</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">문제 수</div>
    <div class="opt-row" id="count-row">
      <button class="opt" data-count="10">10문제</button>
      <button class="opt selected" data-count="20">20문제</button>
      <button class="opt" data-count="30">30문제</button>
      <button class="opt" data-count="0">전체</button>
    </div>
  </div>

  <button class="btn-primary" id="start-btn" onclick="startQuiz()">▶ 시작하기</button>
</div>

<!-- Quiz screen -->
<div id="screen-quiz" style="display:none">
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0"></div></div>
  <div class="progress-info">
    <span id="progress-text">0 / 0</span>
    <span>
      <span class="score-chip ok">✓ <span id="ok-count">0</span></span>
      &nbsp;
      <span class="score-chip ng">✗ <span id="ng-count">0</span></span>
    </span>
  </div>

  <div class="question-card">
    <div class="q-label" id="q-label">의미를 고르세요</div>
    <div class="q-text" id="q-text"></div>
  </div>

  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback"></div>
</div>

<!-- Result screen -->
<div id="screen-result" style="display:none">
  <div class="card result-hero">
    <div class="result-emoji" id="result-emoji">🎉</div>
    <div class="result-title">완료!</div>
    <div class="result-score"><span id="result-correct">0</span> / <span id="result-total">0</span></div>
    <div style="color:var(--muted)" id="result-pct">0%</div>
  </div>

  <div class="card" id="wrong-section" style="display:none">
    <div class="section-title">틀린 단어</div>
    <div class="wrong-list" id="wrong-list"></div>
  </div>

  <div style="display:flex;gap:8px;margin-top:8px">
    <button class="btn-primary" style="flex:1" onclick="restart()">다시 시작</button>
    <button class="btn-ghost" style="flex:1" onclick="goBack()">돌아가기</button>
  </div>
</div>

<!-- Loading / empty states -->
<div id="screen-loading" class="spinner">불러오는 중...</div>
<div id="screen-empty" class="empty" style="display:none">
  <div style="font-size:48px;margin-bottom:12px">📭</div>
  <div id="empty-msg">단어장을 불러올 수 없어요.</div>
  <button class="btn-ghost" style="margin-top:16px" onclick="goBack()">돌아가기</button>
</div>

</div>

<script>
const SUPA_URL = 'https://cheuclwcrxuofiomhtuz.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoZXVjbHdjcnh1b2Zpb21odHV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMzM1NzEsImV4cCI6MjA5MDkwOTU3MX0.Pnmf1_DYGVXpDvEf-nWXG4WTAu-pNlu4xJyEzdHeUMw';
const HDR = {'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
const _token = sessionStorage.getItem('qhub_token');
if(_token) HDR.Authorization = 'Bearer '+_token;
const _origFetch = window.fetch;
window.fetch = function(...args){return _origFetch.apply(this,args).then(r=>{if(r.status===401){sessionStorage.clear();location.href='index.html'}return r})}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

const user = JSON.parse(sessionStorage.getItem('qhub_user')||'null');
if(!user) location.href='index.html';

// ── State ──
const params = new URLSearchParams(location.search);
const wordlistId = params.get('wordlist');
let wordlistInfo = null;
let allWords = [];
let units = [];
let selectedUnits = new Set();
let mode = 'en2ko';
let count = 20;

// 퀴즈 상태
let quizQueue = [];
let curIdx = 0;
let okN = 0, ngN = 0;
let wrongList = [];

function showScreen(name){
  ['setup','quiz','result','loading','empty'].forEach(s=>{
    const el = document.getElementById('screen-'+s);
    if(el) el.style.display = (s===name)?'block':'none';
  });
}

function goBack(){ location.href='dashboard.html' }

async function init(){
  if(!wordlistId){ showEmpty('잘못된 접근입니다.'); return }
  showScreen('loading');
  try{
    // 단어장 정보 + 단어
    const [wRes, wsRes] = await Promise.all([
      fetch(`${SUPA_URL}/rest/v1/wordlists?id=eq.${wordlistId}&select=id,title,class_id,classes(name)`,{headers:HDR}),
      fetch(`${SUPA_URL}/rest/v1/words?wordlist_id=eq.${wordlistId}&select=id,unit,en,ko,idx&order=unit.asc,idx.asc`,{headers:HDR}),
    ]);
    const ws = await wRes.json();
    if(!Array.isArray(ws) || !ws.length){ showEmpty('단어장을 찾을 수 없습니다.'); return }
    wordlistInfo = ws[0];
    document.getElementById('wordlist-title').textContent = wordlistInfo.title;
    if(wordlistInfo.classes && wordlistInfo.classes.name){
      document.getElementById('wordlist-sub').textContent = wordlistInfo.classes.name;
    }

    allWords = await wsRes.json();
    if(!Array.isArray(allWords) || !allWords.length){
      showEmpty('이 단어장에는 등록된 단어가 없어요.');
      return;
    }

    // 단원 추출
    const set = new Set();
    allWords.forEach(w=>set.add(w.unit));
    units = [...set].sort((a,b)=>a-b);
    selectedUnits = new Set(units); // 기본 전체 선택

    renderUnits();
    setupOptHandlers();
    showScreen('setup');
  }catch(e){
    console.error(e);
    showEmpty('불러오기 실패');
  }
}

function showEmpty(msg){
  document.getElementById('empty-msg').textContent = msg;
  showScreen('empty');
}

function renderUnits(){
  const grid = document.getElementById('unit-grid');
  grid.innerHTML = units.map(u=>{
    const cnt = allWords.filter(w=>w.unit===u).length;
    return `<button class="unit-btn ${selectedUnits.has(u)?'selected':''}" onclick="toggleUnit(${u})">
      <div>${u}단원</div>
      <div style="font-size:11px;font-weight:400;opacity:.8;margin-top:2px">${cnt}개</div>
    </button>`;
  }).join('');
}

function toggleUnit(u){
  if(selectedUnits.has(u)) selectedUnits.delete(u);
  else selectedUnits.add(u);
  renderUnits();
  updateStartBtn();
}

function selectAllUnits(){ selectedUnits = new Set(units); renderUnits(); updateStartBtn() }
function clearUnits(){ selectedUnits = new Set(); renderUnits(); updateStartBtn() }

function setupOptHandlers(){
  document.getElementById('mode-row').addEventListener('click',e=>{
    const b = e.target.closest('.opt'); if(!b) return;
    document.querySelectorAll('#mode-row .opt').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
    mode = b.dataset.mode;
  });
  document.getElementById('count-row').addEventListener('click',e=>{
    const b = e.target.closest('.opt'); if(!b) return;
    document.querySelectorAll('#count-row .opt').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
    count = parseInt(b.dataset.count);
  });
}

function updateStartBtn(){
  document.getElementById('start-btn').disabled = selectedUnits.size===0;
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz(){
  // 선택된 단원 단어들
  const pool = allWords.filter(w=>selectedUnits.has(w.unit));
  if(!pool.length) return;
  // 출제 큐 (count=0이면 전체, 그 외 min)
  const shuffled = shuffle(pool);
  const N = (count===0) ? shuffled.length : Math.min(count, shuffled.length);
  quizQueue = shuffled.slice(0, N);
  curIdx = 0; okN = 0; ngN = 0; wrongList = [];
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion(){
  if(curIdx >= quizQueue.length){ finishQuiz(); return }
  const q = quizQueue[curIdx];
  const total = quizQueue.length;
  document.getElementById('progress-text').textContent = `${curIdx+1} / ${total}`;
  document.getElementById('progress-fill').style.width = ((curIdx)/total*100)+'%';
  document.getElementById('ok-count').textContent = okN;
  document.getElementById('ng-count').textContent = ngN;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';

  const isE2K = (mode==='en2ko');
  document.getElementById('q-label').textContent = isE2K ? '의미를 고르세요' : '단어를 고르세요';
  const qTextEl = document.getElementById('q-text');
  qTextEl.textContent = isE2K ? q.en : q.ko;
  qTextEl.className = 'q-text' + (isE2K?'':' ko');

  // 4지선다: 정답 1 + 같은 단어장에서 distractor 3개 (현재 문제 제외, 정답 텍스트 중복 제외)
  const correctText = isE2K ? q.ko : q.en;
  const distractorPool = allWords
    .filter(w => w.id !== q.id)
    .map(w => isE2K ? w.ko : w.en)
    .filter(t => t !== correctText);
  const uniqueDistract = [...new Set(distractorPool)];
  const picked = shuffle(uniqueDistract).slice(0, 3);
  const choices = shuffle([correctText, ...picked]);

  const cEl = document.getElementById('choices');
  cEl.innerHTML = choices.map((c,i)=>`<button class="choice" data-correct="${c===correctText?1:0}" onclick="answer(this)">
    <span class="num">${i+1}</span>
    <span>${esc(c)}</span>
  </button>`).join('');
}

function answer(btn){
  const correct = btn.dataset.correct==='1';
  document.querySelectorAll('.choice').forEach(b=>{
    b.disabled = true;
    if(b.dataset.correct==='1') b.classList.add('correct');
  });
  if(correct){
    okN++;
    document.getElementById('feedback').textContent = '✓ 정답!';
    document.getElementById('feedback').className = 'feedback ok';
  }else{
    ngN++;
    btn.classList.add('wrong');
    const q = quizQueue[curIdx];
    wrongList.push({en:q.en, ko:q.ko});
    document.getElementById('feedback').textContent = '✗ 오답';
    document.getElementById('feedback').className = 'feedback ng';
  }
  document.getElementById('ok-count').textContent = okN;
  document.getElementById('ng-count').textContent = ngN;
  setTimeout(()=>{ curIdx++; renderQuestion() }, 900);
}

function finishQuiz(){
  const total = quizQueue.length;
  const pct = total ? Math.round(okN/total*100) : 0;
  document.getElementById('result-correct').textContent = okN;
  document.getElementById('result-total').textContent = total;
  document.getElementById('result-pct').textContent = pct+'%';
  document.getElementById('result-emoji').textContent = pct>=90?'🎉':pct>=70?'👏':pct>=50?'💪':'📚';

  if(wrongList.length){
    document.getElementById('wrong-section').style.display = 'block';
    document.getElementById('wrong-list').innerHTML = wrongList.map(w=>`<div class="wrong-row">
      <span class="wrong-en">${esc(w.en)}</span>
      <span class="wrong-ko">${esc(w.ko)}</span>
    </div>`).join('');
  }else{
    document.getElementById('wrong-section').style.display = 'none';
  }
  document.getElementById('progress-fill').style.width = '100%';
  showScreen('result');
}

function restart(){ showScreen('setup') }

init();
</script>
</body>
</html>
