<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vocab Combo</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=DM+Sans:wght@400;500;700;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b10;--surface:#14161f;--surface2:#1e2030;--accent:#6C5CE7;--accent-light:#A29BFE;--correct:#00E5A0;--correct-bg:rgba(0,229,160,0.12);--wrong:#FF5E5E;--wrong-bg:rgba(255,94,94,0.12);--text:#F0F0F5;--text-dim:#8B8DA3;--text-muted:#5A5C72;--combo-gold:#FFD700;--combo-fire:#FF6B35;--radius:16px;--radius-sm:12px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;-webkit-appearance:none;appearance:none;cursor:pointer}
body{font-family:"Noto Sans KR","Outfit",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;flex:1}
.screen.active{display:flex}

.home-header{padding:48px 24px 24px;text-align:center}
.home-header .emoji{font-size:48px;margin-bottom:12px}
.home-header h1{font-family:"Outfit",sans-serif;font-size:28px;font-weight:800;letter-spacing:-1px;margin-bottom:6px;word-break:keep-all}
.home-header p{color:var(--text-dim);font-size:13px}
.home-header .hbadge{display:inline-block;background:linear-gradient(135deg,var(--combo-fire),var(--combo-gold));color:#000;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;margin-top:8px;letter-spacing:0.5px}

.section-title{padding:0 24px;font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px}

.mode-selector{display:flex;gap:10px;padding:0 24px;margin-bottom:28px}
.mode-btn{flex:1;background:var(--surface);border:2px solid transparent;border-radius:var(--radius);padding:16px 12px;color:var(--text-dim);font-size:13px;font-weight:600;text-align:center;transition:all .2s;font-family:inherit;line-height:1.4}
.mode-btn.selected{border-color:var(--accent);color:var(--text);background:rgba(108,92,231,0.1)}
.mode-btn .mode-icon{font-size:24px;display:block;margin-bottom:6px}

.lesson-grid{padding:0 24px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lesson-card{background:var(--surface);border:none;border-radius:var(--radius-sm);padding:18px 10px;text-align:center;cursor:pointer;transition:all .2s;font-family:inherit;color:var(--text)}
.lesson-card:active{transform:scale(0.96)}
.lesson-card .lesson-num{font-family:"DM Sans",sans-serif;font-size:22px;font-weight:700;color:var(--accent-light);display:block}
.lesson-card .lesson-range{font-size:11px;color:var(--text-muted);margin-top:4px}
.lesson-card.group-card{grid-column:span 2;background:var(--surface2)}
.lesson-card.group-card .lesson-num{color:var(--accent-light);font-size:16px}
.lesson-card.all-lessons{grid-column:1/-1;background:linear-gradient(135deg,var(--accent),#8B5CF6);padding:20px}
.lesson-card.all-lessons .lesson-num{color:#fff;font-size:18px}
.lesson-card.all-lessons .lesson-range{color:rgba(255,255,255,0.7)}

.quiz-top{padding:16px 24px;display:flex;align-items:center;gap:16px}
.back-btn{background:none;border:none;color:var(--text-dim);font-size:24px;cursor:pointer;padding:4px;font-family:inherit}
.progress-wrap{flex:1}
.progress-info{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:6px}
.progress-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-light));border-radius:3px;transition:width .4s ease}

.combo-badge{position:fixed;top:70px;right:20px;pointer-events:none;z-index:100;display:flex;flex-direction:column;align-items:center;opacity:0;transform:scale(0.5);transition:opacity .25s,transform .25s}
.combo-badge.visible{opacity:1;transform:scale(1)}
.combo-badge-inner{background:linear-gradient(135deg,rgba(255,107,53,0.9),rgba(255,215,0,0.9));border-radius:16px;padding:8px 18px 6px;text-align:center;box-shadow:0 0 30px rgba(255,107,53,0.3);border:2px solid rgba(255,215,0,0.4)}
.combo-badge-num{font-family:"Outfit",sans-serif;font-size:38px;font-weight:900;line-height:1;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.3)}
.combo-badge-label{font-family:"Outfit",sans-serif;font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.85)}
@keyframes comboBadgePop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.combo-badge.pop .combo-badge-inner{animation:comboBadgePop 0.3s ease}

.combo-flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:99;display:none;flex-direction:column;align-items:center}
.combo-flash.visible{display:flex}
.combo-flash-num{font-family:"Outfit",sans-serif;font-size:140px;font-weight:900;line-height:1;background:linear-gradient(180deg,var(--combo-gold),var(--combo-fire));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 40px rgba(255,107,53,0.5))}
.combo-flash-label{font-family:"Outfit",sans-serif;font-size:20px;font-weight:800;letter-spacing:8px;text-transform:uppercase;color:var(--combo-gold);opacity:0.9}
@keyframes flashIn{0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
.combo-flash.playing{animation:flashIn 0.7s ease forwards}

.combo-timer-wrap{position:absolute;top:0;left:0;right:0;height:3px;background:transparent;z-index:50;overflow:hidden}
.combo-timer-bar{height:100%;width:100%;background:linear-gradient(90deg,var(--combo-gold),var(--combo-fire));transform-origin:left;transition:none}

.streak-indicator{display:flex;align-items:center;gap:4px;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:700;color:var(--combo-gold);min-width:50px;justify-content:flex-end;opacity:0;transition:opacity .2s}
.streak-indicator.active{opacity:1}
.streak-indicator .fire{font-size:16px}

.quiz-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 24px 40px;position:relative}
.question-label{font-size:12px;color:var(--text-muted);text-align:center;margin-bottom:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.question-word{text-align:center;margin-bottom:40px;min-height:80px;display:flex;align-items:center;justify-content:center}
.question-word span{font-size:26px;font-weight:700;line-height:1.5;word-break:keep-all;padding:0 12px}

.choices{display:flex;flex-direction:column;gap:12px}
.choice-btn{width:100%;background:var(--surface);border:2px solid var(--surface2);border-radius:var(--radius);padding:18px 20px;color:var(--text);font-size:16px;font-weight:500;text-align:left;cursor:pointer;transition:all .15s;font-family:inherit;line-height:1.4;position:relative;overflow:hidden}
.choice-btn:active:not(.disabled){transform:scale(0.98)}
.choice-btn.disabled{pointer-events:none}
.choice-btn.correct{border-color:var(--correct);background:var(--correct-bg);color:var(--correct)}
.choice-btn.wrong{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong)}
.choice-prefix{font-family:"DM Sans",sans-serif;font-weight:700;font-size:13px;color:var(--text-muted);margin-right:12px;display:inline-block;width:20px}
.choice-btn.correct .choice-prefix{color:var(--correct)}
.choice-btn.wrong .choice-prefix{color:var(--wrong)}

.result-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:40px 24px;text-align:center;overflow-y:auto}
.result-circle{width:160px;height:160px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:28px;position:relative}
.result-circle svg{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotate(-90deg)}
.result-circle circle{fill:none;stroke-width:6;stroke-linecap:round}
.result-circle .track{stroke:var(--surface2)}
.result-circle .fill-circle{stroke:var(--correct);stroke-dasharray:0 999;transition:stroke-dasharray 1s ease}
.result-score{font-family:"DM Sans",sans-serif;font-size:44px;font-weight:900;z-index:1}
.result-label{font-size:13px;color:var(--text-muted);z-index:1}
.result-msg{font-size:20px;font-weight:700;margin-bottom:8px}
.result-sub{font-size:14px;color:var(--text-dim);margin-bottom:24px}

.combo-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:300px;margin-bottom:28px}
.combo-stat-card{background:var(--surface);border-radius:var(--radius-sm);padding:16px 12px;text-align:center}
.combo-stat-card .stat-value{font-family:"Outfit",sans-serif;font-size:28px;font-weight:800;background:linear-gradient(180deg,var(--combo-gold),var(--combo-fire));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.combo-stat-card .stat-label{font-size:11px;color:var(--text-muted);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.combo-stat-card.plain .stat-value{background:none;-webkit-text-fill-color:var(--text);color:var(--text)}

.badges-earned{width:100%;max-width:300px;margin-bottom:20px}
.badges-earned-title{font-size:13px;font-weight:700;color:var(--combo-gold);text-align:center;margin-bottom:12px;letter-spacing:1px}
.badges-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.badge-item{background:var(--surface);border:1px solid rgba(255,215,0,0.2);border-radius:var(--radius-sm);padding:10px 14px;display:flex;align-items:center;gap:8px;animation:badgeReveal 0.5s ease forwards;opacity:0}
.badge-item .badge-icon{font-size:22px}
.badge-item .badge-name{font-size:12px;font-weight:700;color:var(--combo-gold)}
.badge-item .badge-desc{font-size:10px;color:var(--text-muted)}
@keyframes badgeReveal{0%{opacity:0;transform:scale(0.7)}60%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}

.result-actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px}
.result-btn{width:100%;padding:16px;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;border:none;transition:all .2s}
.result-btn:active{transform:scale(0.97)}
.result-btn.primary{background:linear-gradient(135deg,var(--accent),#8B5CF6);color:#fff}
.result-btn.secondary{background:var(--surface);color:var(--text-dim)}
.result-btn.fire{background:linear-gradient(135deg,var(--combo-fire),var(--combo-gold));color:#000;font-weight:800}

.wrong-section{width:100%;margin-top:24px;text-align:left}
.wrong-section h3{font-size:14px;color:var(--wrong);margin-bottom:12px;padding:0 4px}
.wrong-item{background:var(--surface);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.wrong-item .eng{font-family:"DM Sans",sans-serif;font-weight:700;font-size:15px;color:var(--accent-light)}
.wrong-item .kor{font-size:13px;color:var(--text-dim);text-align:right;flex-shrink:1}

.timeline{width:100%;margin-top:20px}
.timeline h3{font-size:14px;color:var(--text-dim);margin-bottom:12px;padding:0 4px}
.tl-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:4px}
.tl-row.tl-correct{background:rgba(0,229,160,0.06)}
.tl-row.tl-wrong{background:rgba(255,94,94,0.06)}
.tl-num{font-family:"DM Sans",sans-serif;font-size:11px;font-weight:700;color:var(--text-muted);width:20px;text-align:center}
.tl-word{flex:1;font-size:14px;font-weight:600}
.tl-icon{font-size:16px}
.tl-combo{font-family:"DM Sans",sans-serif;font-size:12px;font-weight:700;color:var(--combo-gold)}
.tl-time{font-family:"DM Sans",sans-serif;font-size:11px;color:var(--text-muted);min-width:40px;text-align:right}

@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease forwards}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake 0.3s ease}

.mode-card{display:flex;align-items:center;gap:16px;width:100%;padding:18px 20px;background:var(--surface);border:2px solid var(--surface2);border-radius:var(--radius);cursor:pointer;font-family:inherit;color:var(--text);text-align:left;transition:all .2s}
.mode-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.mode-card.inf{border-color:rgba(255,107,53,.3);background:linear-gradient(135deg,rgba(255,107,53,.08),rgba(255,215,0,.08))}
.mode-card.inf:hover{border-color:var(--combo-fire)}
.mc-icon{font-size:28px;flex-shrink:0}
.mc-info{flex:1}
.mc-name{font-size:15px;font-weight:700;margin-bottom:2px}
.mc-desc{font-size:11px;color:var(--text-muted)}

.spinner-screen{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--text-dim);font-size:14px}
.empty-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:24px;text-align:center}
.empty-screen .icon{font-size:56px;margin-bottom:12px}
.empty-screen .msg{font-size:16px;color:var(--text-dim);margin-bottom:16px}
</style>
</head>
<body>

<div class="app">

<!-- Loading -->
<div class="screen active" id="loadingScreen">
  <div class="spinner-screen">불러오는 중...</div>
</div>

<!-- Empty / Error -->
<div class="screen" id="emptyScreen">
  <div class="empty-screen">
    <div class="icon">📭</div>
    <div class="msg" id="emptyMsg">단어장을 불러올 수 없어요.</div>
    <button class="result-btn secondary" style="max-width:200px" onclick="goBackToParent()">돌아가기</button>
  </div>
</div>

<!-- Home -->
<div class="screen" id="homeScreen">
  <div class="home-header">
    <div class="emoji">⚡</div>
    <h1 id="homeTitle">Vocab Combo</h1>
    <p id="homeSub">- · -단어</p>
    <div class="hbadge" id="homeBadge">🔥 COMBO MODE</div>
  </div>
  <div class="section-title">퀴즈 모드</div>
  <div class="mode-selector">
    <button class="mode-btn selected" data-mode="kor2eng"><span class="mode-icon">🇰🇷→🇬🇧</span>한글 뜻 → 영단어</button>
    <button class="mode-btn" data-mode="eng2kor"><span class="mode-icon">🇬🇧→🇰🇷</span>영단어 → 한글 뜻</button>
  </div>
  <div class="section-title">단원 선택</div>
  <div class="lesson-grid" id="lessonGrid"></div>
</div>

<!-- Mode select -->
<div class="screen" id="modeScreen">
  <div style="padding:48px 24px;text-align:center">
    <div style="font-size:40px;margin-bottom:12px">🎯</div>
    <h2 style="font-size:22px;font-weight:800;margin-bottom:6px" id="modeTitle">—</h2>
    <p style="color:var(--text-dim);font-size:13px;margin-bottom:28px" id="modeSub">—</p>
    <div style="display:flex;flex-direction:column;gap:12px;padding:0 12px">
      <button class="mode-card" data-qmode="quick">
        <div class="mc-icon">⚡</div>
        <div class="mc-info"><div class="mc-name">빠른 테스트</div><div class="mc-desc" id="modeQuickDesc">10문제</div></div>
      </button>
      <button class="mode-card" data-qmode="all">
        <div class="mc-icon">📋</div>
        <div class="mc-info"><div class="mc-name">전체 풀기</div><div class="mc-desc" id="modeAllDesc">—</div></div>
      </button>
      <button class="mode-card inf" data-qmode="inf">
        <div class="mc-icon">🔥</div>
        <div class="mc-info"><div class="mc-name">무한 콤보</div><div class="mc-desc">콤보 끊기면 종료! 최고 기록에 도전</div></div>
      </button>
    </div>
    <button style="margin-top:20px;background:none;border:none;color:var(--text-muted);font-size:13px;cursor:pointer;font-family:inherit" data-action="home">← 돌아가기</button>
  </div>
</div>

<!-- Quiz -->
<div class="screen" id="quizScreen">
  <div class="combo-timer-wrap"><div class="combo-timer-bar" id="comboTimerBar"></div></div>
  <div class="quiz-top">
    <button class="back-btn" data-action="home">←</button>
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="progressText">1 / 10</span>
        <span id="quizTitle"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="streak-indicator" id="streakIndicator">
      <span class="fire">🔥</span><span id="streakNum">0</span>
    </div>
  </div>
  <div class="quiz-body">
    <div class="question-label" id="questionLabel"></div>
    <div class="question-word"><span id="questionText"></span></div>
    <div class="choices" id="choices"></div>
  </div>
</div>

<!-- Result -->
<div class="screen" id="resultScreen">
  <div class="result-body" id="resultBody"></div>
</div>

</div>

<!-- Combo overlays -->
<div class="combo-badge" id="comboBadge"><div class="combo-badge-inner"><div class="combo-badge-num" id="comboBadgeNum">2</div><div class="combo-badge-label">COMBO</div></div></div>
<div class="combo-flash" id="comboFlash"><div class="combo-flash-num" id="comboFlashNum">5</div><div class="combo-flash-label">COMBO!</div></div>

<script>
// ===== Supabase config =====
var SUPA_URL='https://cheuclwcrxuofiomhtuz.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoZXVjbHdjcnh1b2Zpb21odHV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMzM1NzEsImV4cCI6MjA5MDkwOTU3MX0.Pnmf1_DYGVXpDvEf-nWXG4WTAu-pNlu4xJyEzdHeUMw';
var HDR={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
var _token=sessionStorage.getItem('qhub_token');
if(_token) HDR.Authorization='Bearer '+_token;
var _origFetch=window.fetch;
window.fetch=function(){var args=arguments;return _origFetch.apply(this,args).then(function(r){if(r.status===401){sessionStorage.clear();location.href='index.html'}return r})};

// ===== Auth =====
var user=JSON.parse(sessionStorage.getItem('qhub_user')||'null');
if(!user) location.href='index.html';

// ===== State =====
var params=new URLSearchParams(location.search);
var wordlistId=params.get('wordlist');
var wordlistTitle='';

var ALL_WORDS=[];        // [num, eng, kor]
var LESSON_SIZES=[];
var LESSON_OFFSETS=[];
var LESSON_LABELS=[];    // unit numbers as strings
var NUM_LESSONS=0;
var GROUP_DEFS=[];       // [[lessonIdx,...], ...]
var GROUP_LABELS=[];

var QUIZ_SIZE=10;
var ORIG_QS=10;
var COMBO_TIME_LIMIT=5000; // 5s
var currentMode='kor2eng';
var quizMode='normal';
var quizWords=[];
var quizQueue=[];
var currentIndex=0;
var score=0;
var wrongList=[];
var currentLessonLabel='';
var combo=0;
var maxCombo=0;
var lastCorrectTime=0;
var comboTimerRAF=null;
var answerLog=[];
var questionStartTime=0;
var quizStartTime=0;
var totalTime=0;
var infBest=parseInt(localStorage.getItem('infBest_'+wordlistId)||'0');

function showScreen(id){
  var ss=document.querySelectorAll('.screen');
  for(var i=0;i<ss.length;i++) ss[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function showError(msg){
  document.getElementById('emptyMsg').textContent=msg;
  showScreen('emptyScreen');
}

function goBackToParent(){
  // iframe 안에서 열려있으면 부모에 close 메시지, 아니면 dashboard로
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage({type:'wordquiz-close'},'*');
      return;
    }
  }catch(e){}
  location.href='dashboard.html';
}

// ===== Init: load wordlist + words =====
async function init(){
  if(!wordlistId){ showError('잘못된 접근입니다.'); return }
  try{
    var wRes=await fetch(SUPA_URL+'/rest/v1/wordlists?id=eq.'+wordlistId+'&select=id,title,class_id,classes!class_id(name)',{headers:HDR});
    var ws=await wRes.json();
    if(!Array.isArray(ws)||!ws.length){ showError('단어장을 찾을 수 없습니다.'); return }
    wordlistTitle=ws[0].title;
    // junction 우선: wordlist_classes 에서 모든 분반명 조회. 비어 있으면 legacy class_id 폴백.
    var className='';
    try{
      var jRes=await fetch(SUPA_URL+'/rest/v1/wordlist_classes?wordlist_id=eq.'+wordlistId+'&select=classes(name)',{headers:HDR});
      if(jRes.ok){
        var jArr=await jRes.json();
        if(Array.isArray(jArr) && jArr.length){
          className = jArr.map(function(r){return r.classes?r.classes.name:''}).filter(Boolean).join(', ');
        }
      }
    }catch(e){}
    if(!className) className = ws[0].classes ? ws[0].classes.name : '';
    // 단어장별 콤보 시간 (관리자 설정, 기본 5초). 컬럼 없으면 fallback.
    try{
      var csRes=await fetch(SUPA_URL+'/rest/v1/wordlists?id=eq.'+wordlistId+'&select=combo_seconds',{headers:HDR});
      if(csRes.ok){
        var csArr=await csRes.json();
        if(Array.isArray(csArr)&&csArr.length){
          var cs=csArr[0].combo_seconds;
          if(typeof cs==='number'&&cs>0&&cs<=30) COMBO_TIME_LIMIT=cs*1000;
        }
      }
    }catch(e){}

    var sRes=await fetch(SUPA_URL+'/rest/v1/words?wordlist_id=eq.'+wordlistId+'&select=id,unit,en,ko,idx&order=unit.asc,idx.asc',{headers:HDR});
    var rows=await sRes.json();
    if(!Array.isArray(rows)||!rows.length){ showError('이 단어장에는 등록된 단어가 없어요.'); return }

    // 단원별 그룹
    var unitMap=new Map();
    rows.forEach(function(r){
      var u=String(r.unit);
      if(!unitMap.has(u)) unitMap.set(u,[]);
      unitMap.get(u).push({en:r.en,ko:r.ko});
    });
    // 정렬: 숫자 단원이면 숫자 정렬
    var unitKeys=Array.from(unitMap.keys()).sort(function(a,b){
      var na=parseInt(a),nb=parseInt(b);
      if(!isNaN(na)&&!isNaN(nb)) return na-nb;
      return String(a).localeCompare(String(b));
    });

    var wordIdx=0;
    LESSON_LABELS=[];
    LESSON_SIZES=[];
    LESSON_OFFSETS=[];
    ALL_WORDS=[];
    unitKeys.forEach(function(u){
      var items=unitMap.get(u);
      LESSON_LABELS.push(u);
      LESSON_OFFSETS.push(wordIdx);
      LESSON_SIZES.push(items.length);
      items.forEach(function(it){
        wordIdx++;
        ALL_WORDS.push([wordIdx,it.en,it.ko]);
      });
    });
    NUM_LESSONS=unitKeys.length;

    // 그룹 (3 단원씩)
    GROUP_DEFS=[];
    GROUP_LABELS=[];
    if(NUM_LESSONS>3){
      var g=Math.ceil(NUM_LESSONS/3);
      for(var i=0;i<g;i++){
        var s=i*3;
        var e=Math.min(s+2,NUM_LESSONS-1);
        var arr=[];
        for(var j=s;j<=e;j++) arr.push(j);
        GROUP_DEFS.push(arr);
        GROUP_LABELS.push(LESSON_LABELS[s]+'~'+LESSON_LABELS[e]+'단원');
      }
    }

    // 헤더
    document.getElementById('homeTitle').textContent=wordlistTitle;
    var totalWords=ALL_WORDS.length;
    document.getElementById('homeSub').textContent=(className?className+' · ':'')+totalWords+'단어 · '+NUM_LESSONS+'단원';

    renderLessonGrid();
    showScreen('homeScreen');
  }catch(e){
    console.error(e);
    showError('불러오기 실패');
  }
}

function renderLessonGrid(){
  var totalWords=ALL_WORDS.length;
  var html='';
  // 전체 테스트
  html+='<button class="lesson-card all-lessons" data-lesson="-1"><span class="lesson-num">전체 테스트</span><span class="lesson-range">'+totalWords+'단어 중 선택</span></button>';
  // 그룹
  for(var g=0;g<GROUP_DEFS.length;g++){
    var def=GROUP_DEFS[g];
    var s=LESSON_OFFSETS[def[0]]+1;
    var lastIdx=def[def.length-1];
    var e=LESSON_OFFSETS[lastIdx]+LESSON_SIZES[lastIdx];
    html+='<button class="lesson-card group-card" data-group="'+g+'"><span class="lesson-num">'+esc(GROUP_LABELS[g])+'</span><span class="lesson-range">'+s+'~'+e+'</span></button>';
  }
  // 개별 단원
  for(var i=0;i<NUM_LESSONS;i++){
    var s2=LESSON_OFFSETS[i]+1;
    var e2=LESSON_OFFSETS[i]+LESSON_SIZES[i];
    html+='<button class="lesson-card" data-lesson="'+i+'"><span class="lesson-num">'+esc(LESSON_LABELS[i])+'단원</span><span class="lesson-range">'+s2+'~'+e2+'</span></button>';
  }
  document.getElementById('lessonGrid').innerHTML=html;
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

function selectMode(m){
  currentMode=m;
  var bs=document.querySelectorAll('.mode-btn');
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle('selected',bs[i].dataset.mode===m);
}

function shuffle(a){
  var r=a.slice();
  for(var i=r.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=r[i];r[i]=r[j];r[j]=t;
  }
  return r;
}

function startGroup(gi){
  quizWords=[];
  GROUP_DEFS[gi].forEach(function(l){
    quizWords=quizWords.concat(ALL_WORDS.slice(LESSON_OFFSETS[l],LESSON_OFFSETS[l]+LESSON_SIZES[l]));
  });
  currentLessonLabel=GROUP_LABELS[gi];
  showModeScreen();
}

function startQuiz(li){
  if(li===-1){
    quizWords=ALL_WORDS.slice();
    currentLessonLabel='전체';
  }else{
    quizWords=ALL_WORDS.slice(LESSON_OFFSETS[li],LESSON_OFFSETS[li]+LESSON_SIZES[li]);
    currentLessonLabel=LESSON_LABELS[li]+'단원';
  }
  showModeScreen();
}

function showModeScreen(){
  document.getElementById('modeTitle').textContent=currentLessonLabel;
  document.getElementById('modeSub').textContent=quizWords.length+'개 단어';
  document.getElementById('modeAllDesc').textContent='전체 '+quizWords.length+'문제';
  document.getElementById('modeQuickDesc').textContent=Math.min(ORIG_QS,quizWords.length)+'문제';
  // 무한 콤보 카드 안내 — 전체일 때만 리더보드 기록
  var isFull = (currentLessonLabel === '전체');
  var infDescEl = document.querySelector('.mode-card.inf .mc-desc');
  if(infDescEl){
    infDescEl.textContent = isFull
      ? '콤보 끊기면 종료! 🏆 리더보드 기록됨'
      : '콤보 끊기면 종료 (개인 기록만 저장)';
  }
  showScreen('modeScreen');
}

function setQuizMode(m){
  if(m==='quick'){quizMode='normal';QUIZ_SIZE=Math.min(ORIG_QS,quizWords.length);beginQuiz();return}
  if(m==='inf'){
    quizMode='infinite';
    quizQueue=shuffle(quizWords.slice());
    currentIndex=0;score=0;combo=0;maxCombo=0;lastCorrectTime=0;wrongList=[];answerLog=[];
    quizStartTime=Date.now();
    showScreen('quizScreen');
    renderQuestion();
    return;
  }
  if(m==='all'){quizMode='normal';QUIZ_SIZE=quizWords.length;beginQuiz();return}
}

function beginQuiz(){
  quizQueue=shuffle(quizWords).slice(0,QUIZ_SIZE);
  currentIndex=0;score=0;combo=0;maxCombo=0;lastCorrectTime=0;wrongList=[];answerLog=[];
  quizStartTime=Date.now();
  showScreen('quizScreen');
  renderQuestion();
}

function goHome(){cancelComboTimer();hideCombo();showScreen('homeScreen')}

function startComboTimer(){
  var bar=document.getElementById('comboTimerBar');
  var st=Date.now();
  bar.style.transform='scaleX(1)';
  bar.style.transition='none';
  cancelComboTimer();
  function tick(){
    var p=Math.max(0,1-(Date.now()-st)/COMBO_TIME_LIMIT);
    bar.style.transform='scaleX('+p+')';
    if(p>0){
      comboTimerRAF=requestAnimationFrame(tick);
    }else if(quizMode==='infinite'){
      var bs=document.querySelectorAll('.choice-btn');
      for(var i=0;i<bs.length;i++) bs[i].classList.add('disabled');
      combo=0;hideCombo();updateStreakUI();
      setTimeout(function(){showInfiniteResult()},500);
    }else{
      combo=0;hideCombo();updateStreakUI();
    }
  }
  comboTimerRAF=requestAnimationFrame(tick);
}

function cancelComboTimer(){if(comboTimerRAF){cancelAnimationFrame(comboTimerRAF);comboTimerRAF=null}}

function showComboPopup(n){
  var b=document.getElementById('comboBadge'),bn=document.getElementById('comboBadgeNum');
  b.classList.add('visible');bn.textContent=n;
  b.classList.remove('pop');b.offsetHeight;b.classList.add('pop');
  var f=document.getElementById('comboFlash'),fn=document.getElementById('comboFlashNum');
  fn.textContent=n;
  f.classList.remove('visible');f.classList.remove('playing');f.offsetHeight;
  f.classList.add('visible');f.classList.add('playing');
  setTimeout(function(){f.classList.remove('visible');f.classList.remove('playing')},700);
}

function hideCombo(){document.getElementById('comboBadge').classList.remove('visible')}

function updateStreakUI(){
  var el=document.getElementById('streakIndicator'),n=document.getElementById('streakNum');
  if(combo>=2){el.classList.add('active');n.textContent=combo}else{el.classList.remove('active')}
}

function renderQuestion(){
  var total=quizQueue.length,cur=quizQueue[currentIndex],num=cur[0],eng=cur[1],kor=cur[2];
  document.getElementById('progressText').textContent=quizMode==='infinite'?'🔥 '+(currentIndex+1):(currentIndex+1)+' / '+total;
  document.getElementById('quizTitle').textContent=currentLessonLabel;
  document.getElementById('progressFill').style.width=((currentIndex/total)*100)+'%';
  // distractors
  var pool=quizWords.filter(function(w){return w[0]!==num});
  // 더 큰 풀: 단원 외 전체 풀에서도 보충
  if(pool.length<3){
    pool=ALL_WORDS.filter(function(w){return w[0]!==num});
  }
  var distractors=shuffle(pool).slice(0,3);
  var options;
  var ql=document.getElementById('questionLabel'),qt=document.getElementById('questionText');
  if(currentMode==='kor2eng'){
    ql.textContent='다음 뜻에 해당하는 단어는?';
    qt.textContent=kor;
    options=shuffle([{text:eng,correct:true}].concat(distractors.map(function(d){return{text:d[1],correct:false}})));
  }else{
    ql.textContent='다음 단어의 뜻은?';
    qt.textContent=eng;
    options=shuffle([{text:kor,correct:true}].concat(distractors.map(function(d){return{text:d[2],correct:false}})));
  }
  var pf=['A','B','C','D'],ch=document.getElementById('choices');
  ch.innerHTML='';
  options.forEach(function(o,i){
    var b=document.createElement('button');
    b.className='choice-btn fade-in';
    b.style.animationDelay=(i*0.05)+'s';
    var sp=document.createElement('span');sp.className='choice-prefix';sp.textContent=pf[i];
    b.appendChild(sp);
    b.appendChild(document.createTextNode(o.text));
    b.onclick=function(){handleAnswer(b,o.correct)};
    ch.appendChild(b);
  });
  questionStartTime=Date.now();
  if(combo>=1) startComboTimer();
  else document.getElementById('comboTimerBar').style.transform='scaleX(0)';
  updateStreakUI();
}

function handleAnswer(btn,isCorrect){
  var now=Date.now(),answerTime=now-questionStartTime;
  cancelComboTimer();
  if(isCorrect){
    var bs=document.querySelectorAll('.choice-btn');
    for(var i=0;i<bs.length;i++) bs[i].classList.add('disabled');
    btn.classList.add('correct');
    var tsl=lastCorrectTime?(now-lastCorrectTime):Infinity;
    if(combo===0||tsl<=COMBO_TIME_LIMIT) combo++;
    else combo=1;
    lastCorrectTime=now;
    if(combo>maxCombo) maxCombo=combo;
    if(combo>=2) showComboPopup(combo);
    updateStreakUI();
    if(!quizQueue[currentIndex]._wrong) score++;
    answerLog.push({word:quizQueue[currentIndex],correct:true,combo:combo,time:answerTime});
    setTimeout(function(){
      currentIndex++;
      if(currentIndex<quizQueue.length){
        renderQuestion();
      }else if(quizMode==='infinite'){
        quizQueue=quizQueue.concat(shuffle(quizWords.slice()));
        renderQuestion();
      }else{
        showResult();
      }
    },combo>=2?200:300);
  }else{
    btn.classList.add('wrong');btn.classList.add('disabled');btn.style.pointerEvents='none';
    document.querySelector('.quiz-body').classList.add('shake');
    setTimeout(function(){document.querySelector('.quiz-body').classList.remove('shake')},300);
    combo=0;lastCorrectTime=0;hideCombo();updateStreakUI();
    document.getElementById('comboTimerBar').style.transform='scaleX(0)';
    if(quizMode==='infinite'){
      var bs2=document.querySelectorAll('.choice-btn');
      for(var i=0;i<bs2.length;i++) bs2[i].classList.add('disabled');
      setTimeout(function(){showInfiniteResult()},800);
      return;
    }
    if(!quizQueue[currentIndex]._wrong){
      quizQueue[currentIndex]._wrong=true;
      wrongList.push(quizQueue[currentIndex]);
      answerLog.push({word:quizQueue[currentIndex],correct:false,combo:0,time:answerTime});
    }
  }
}

function showResult(){
  cancelComboTimer();hideCombo();
  var total=quizQueue.length,pct=Math.round((score/total)*100),circ=2*Math.PI*72;
  totalTime=Date.now()-quizStartTime;
  var BDEFS=[
    {type:'complete',icon:'🏅',name:'완주',desc:'퀴즈 완료',cond:function(){return true}},
    {type:'perfect',icon:'💎',name:'퍼펙트',desc:'100% 정답',cond:function(){return pct===100}},
    {type:'combo5',icon:'🔥',name:'콤보 마스터',desc:'5콤보 이상',cond:function(){return maxCombo>=5}},
    {type:'combo_king',icon:'👑',name:'콤보 킹',desc:QUIZ_SIZE+'콤보',cond:function(){return maxCombo>=QUIZ_SIZE}},
    {type:'speed',icon:'⚡',name:'스피드스타',desc:'60초 이내',cond:function(){return totalTime<=60000&&pct>=80}},
    {type:'no_miss',icon:'🎯',name:'무실수',desc:'한 번도 안 틀림',cond:function(){return wrongList.length===0}}
  ];
  var earned=BDEFS.filter(function(b){return b.cond()});
  var msg,sub;
  if(pct===100&&maxCombo===QUIZ_SIZE){msg='PERFECT COMBO! 🔥';sub='전문제 콤보 달성!'}
  else if(pct===100){msg='완벽해요! 🎉';sub='모든 단어를 맞혔어요!'}
  else if(pct>=80){msg='훌륭해요! 👏';sub='거의 다 맞혔어요!'}
  else if(pct>=60){msg='잘했어요! 💪';sub='조금만 더 복습하면 완벽!'}
  else{msg='힘내요! 🔥';sub='반복 학습이 답이에요!'}

  var tlH='<div class="timeline"><h3>문제별 기록</h3>';
  answerLog.forEach(function(a,i){
    var c=a.correct?'tl-correct':'tl-wrong',ic=a.correct?'✅':'❌';
    var ct=a.combo>=2?'<span class="tl-combo">🔥'+a.combo+'</span>':'';
    var ts=(a.time/1000).toFixed(1);
    tlH+='<div class="tl-row '+c+'"><span class="tl-num">'+(i+1)+'</span><span class="tl-word">'+esc(a.word[1])+'</span>'+ct+'<span class="tl-time">'+ts+'s</span><span class="tl-icon">'+ic+'</span></div>';
  });
  tlH+='</div>';

  var wH='';
  if(wrongList.length>0){
    wH='<div class="wrong-section"><h3>틀린 단어 ('+wrongList.length+'개)</h3>';
    wrongList.forEach(function(w){
      wH+='<div class="wrong-item"><span class="eng">'+esc(w[1])+'</span><span class="kor">'+esc(w[2])+'</span></div>';
    });
    wH+='</div>';
  }

  var bH='';
  if(earned.length>0){
    bH='<div class="badges-earned"><div class="badges-earned-title">🏆 획득한 뱃지</div><div class="badges-grid">';
    earned.forEach(function(b,i){
      bH+='<div class="badge-item" style="animation-delay:'+(i*0.15)+'s"><span class="badge-icon">'+b.icon+'</span><div><div class="badge-name">'+esc(b.name)+'</div><div class="badge-desc">'+esc(b.desc)+'</div></div></div>';
    });
    bH+='</div></div>';
  }

  document.getElementById('resultBody').innerHTML=
    '<div class="result-circle"><svg viewBox="0 0 160 160"><circle class="track" cx="80" cy="80" r="72"/><circle class="fill-circle" id="resultArc" cx="80" cy="80" r="72"/></svg><span class="result-score">'+pct+'%</span><span class="result-label">'+score+' / '+total+'</span></div>'
    +'<div class="result-msg">'+esc(msg)+'</div>'
    +'<div class="result-sub">'+esc(sub)+'</div>'
    +'<div class="combo-stats"><div class="combo-stat-card"><div class="stat-value">'+maxCombo+'</div><div class="stat-label">🔥 Max Combo</div></div><div class="combo-stat-card plain"><div class="stat-value">'+(totalTime/1000).toFixed(1)+'s</div><div class="stat-label">총 풀이 시간</div></div></div>'
    +bH
    +'<div class="result-actions">'
    +(wrongList.length>0?'<button class="result-btn fire" data-action="retry-wrong">🔥 틀린 단어만 다시</button>':'')
    +'<button class="result-btn primary" data-action="restart">다시 풀기</button>'
    +'<button class="result-btn secondary" data-action="home">홈으로</button>'
    +'</div>'
    +tlH+wH;

  showScreen('resultScreen');
  requestAnimationFrame(function(){
    var a=document.getElementById('resultArc');
    if(a) a.style.strokeDasharray=((pct/100)*circ)+' '+circ;
  });

  // postMessage to parent (dashboard)
  try{
    var ww=wrongList.map(function(w){return{eng:w[1],kor:w[2]}});
    if(window.parent && window.parent !== window){
      window.parent.postMessage({
        type:'quiz-result',
        score:score,total:total,pct:pct,
        maxCombo:maxCombo,totalTime:totalTime,
        badges:earned.map(function(b){return b.type}),
        wrongWords:ww,
        sourceType:'wordlist',
        sourceId:wordlistId,
        title:wordlistTitle+' · '+currentLessonLabel
      },'*');
    }
  }catch(e){}
}

function retryWrong(){
  quizQueue=shuffle(wrongList.slice());
  currentIndex=0;score=0;combo=0;maxCombo=0;lastCorrectTime=0;wrongList=[];answerLog=[];
  quizStartTime=Date.now();
  showScreen('quizScreen');
  renderQuestion();
}

function showInfiniteResult(){
  cancelComboTimer();hideCombo();
  var total=currentIndex;
  var isFullRun = (currentLessonLabel === '전체');
  // localStorage 개인 최고 기록은 단원/그룹/전체 분리 저장
  var bestKey = 'infBest_'+wordlistId+'_'+currentLessonLabel;
  var localBest = parseInt(localStorage.getItem(bestKey)||'0');
  var isNew = total > localBest;
  if(isNew){
    localBest = total;
    try{localStorage.setItem(bestKey,String(localBest))}catch(e){}
  }
  infBest = localBest;
  totalTime=Date.now()-quizStartTime;
  var msg=isNew?'NEW RECORD!':'GAME OVER';
  var ico=isNew?'🏆':'💥';
  var sub=isNew?'이전 기록을 갱신했어요!':'콤보가 끊겼습니다';
  var gc=isNew?'var(--combo-gold)':'var(--text)';

    ? '<div style="margin-top:14px;padding:8px 14px;background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.3);border-radius:10px;color:var(--combo-gold);font-size:12px;font-weight:600">🏆 리더보드에 기록됩니다</div>'
    : '<div style="margin-top:14px;padding:8px 14px;background:var(--surface);border-radius:10px;color:var(--text-muted);font-size:11px">리더보드는 <b style="color:var(--text-dim)">전체 테스트</b>일 때만 기록돼요</div>';
  var rb=document.getElementById('resultBody');
  rb.innerHTML='';
  var d=document.createElement('div');
  d.style.cssText='margin-top:30px;text-align:center;width:100%';
  d.innerHTML='<div style="font-size:60px;margin-bottom:12px">'+ico+'</div>'
    +'<div style="font-size:24px;font-weight:800;margin-bottom:4px">'+msg+'</div>'
    +'<div style="color:var(--text-dim);font-size:14px;margin-bottom:8px">'+sub+'</div>'
    +'<div style="color:var(--text-muted);font-size:12px;margin-bottom:20px">'+esc(currentLessonLabel)+'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:280px;margin:0 auto 8px">'
    +'<div style="background:var(--surface);border-radius:12px;padding:16px;text-align:center"><div style="font-size:36px;font-weight:900;background:linear-gradient(180deg,#FFD700,#FF6B35);-webkit-background-clip:text;-webkit-text-fill-color:transparent">'+total+'</div><div style="font-size:11px;color:var(--text-muted);margin-top:4px">연속 정답</div></div>'
    +'<div style="background:var(--surface);border-radius:12px;padding:16px;text-align:center"><div style="font-size:36px;font-weight:900;color:'+gc+'">'+localBest+'</div><div style="font-size:11px;color:var(--text-muted);margin-top:4px">🏆 최고 기록</div></div>'
    +'</div>'
    +lbInfo;
  rb.appendChild(d);
  var btns=document.createElement('div');
  btns.style.cssText='display:flex;flex-direction:column;gap:10px;max-width:280px;margin:24px auto 0;width:100%';
  var b1=document.createElement('button');b1.className='result-btn fire';b1.textContent='🔥 다시 도전';b1.setAttribute('data-action','retry-inf');
  var b2=document.createElement('button');b2.className='result-btn primary';b2.textContent='홈으로';b2.setAttribute('data-action','home');
  btns.appendChild(b1);btns.appendChild(b2);
  rb.appendChild(btns);
  showScreen('resultScreen');

  // postMessage 무한 콤보 결과 → 전체 테스트일 때만 리더보드 저장
  if(!isFullRun) return;
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage({
        type:'combo-result',
        streak:total,
        sourceType:'wordlist',
        sourceId:wordlistId,
        quizTitle:'[단어장] '+wordlistTitle
      },'*');
    }
  }catch(e){}
}

// ===== Global click delegation =====
document.addEventListener('click',function(e){
  var b=e.target.closest('button');
  if(!b) return;
  if(b.classList.contains('mode-btn')&&b.dataset.mode){selectMode(b.dataset.mode);return}
  if(b.dataset.group!==undefined){startGroup(parseInt(b.dataset.group));return}
  if(b.dataset.lesson!==undefined){startQuiz(parseInt(b.dataset.lesson));return}
  if(b.classList.contains('back-btn')){goHome();return}
  if(b.dataset.action==='retry-wrong'){retryWrong();return}
  if(b.dataset.action==='restart'){beginQuiz();return}
  if(b.dataset.action==='home'){goHome();return}
  if(b.dataset.qmode){setQuizMode(b.dataset.qmode);return}
  if(b.dataset.action==='retry-inf'){setQuizMode('inf');return}
});

init();
</script>
</body>
</html>
